let state;try{state=JSON.parse(localStorage.getItem('neuro-demo-v11'));if(!state||state.version!==11||!Array.isArray(state.projects)||!Number.isFinite(state.balance)||!PLANS[state.plan])state=seed()}catch{state=seed()}

function previewHtml(){let p=preview||(mode==='video'?state.projects.find(x=>x.type==='video'):state.projects.find(x=>x.kind==='bottle'))||seed().projects[0];const isVideo=mode==='video'&&!preview||p.type==='video';return '<div class="art-wrap '+(isVideo?'has-video':'')+'">'+(isVideo?videoPlayer():art(p.kind,p.name))+'<span class="preview-label">✧ '+(isVideo?'VIDEO MP4 · MUESTRA DE 6 S':'INSPIRACIÓN VISUAL')+'</span><div class="preview-footer"><h3>'+esc(preview?p.name:isVideo?'Historias que se mueven.':'Lo natural también sorprende.')+'</h3><p>'+(isVideo?'Video ilustrativo incluido; no generado por el modelo seleccionado.':'Referencia visual incluida; no generada a partir del texto.')+'</p><div class="tags"><span class="tag">'+esc(preview?.model||MODELS[mode][model].name)+'</span><span class="tag">Simulación</span></div>'+(preview?'<div class="preview-buttons"><button data-open="'+esc(p.id)+'">Ver resultado ↗</button><button data-add="'+esc(p.id)+'">＋ Añadir a historia</button></div>':'')+'</div>'+(busy?'<div class="progress" role="status"><div class="spinner"></div><strong>Dándole forma a tu idea…</strong><p>Simulación local</p></div>':'')+'</div>'}
function studio(){return heading('UN ESPACIO PARA TUS IDEAS','¿Qué vamos a crear hoy?','Transforma una idea en imágenes e historias que conectan.','<span class="pill">✦ Tu imaginación, el punto de partida</span>')+
'<div class="studio-grid"><section class="panel"><div class="panel-top"><h2>Dale forma a tu idea</h2><span class="step">01 — CREAR</span></div><div class="tabs" aria-label="Tipo de creación"><button data-mode="image" class="'+(mode==='image'?'selected':'')+'">▧ Imagen</button><button data-mode="video" class="'+(mode==='video'?'selected':'')+'">▷ Video</button></div><label class="fieldlabel" for="prompt">Describe tu idea <span class="tiny">En tus propias palabras</span></label><div class="promptbox"><textarea id="prompt" maxlength="1200" placeholder="¿Qué te gustaría crear?">'+esc(prompt)+'</textarea><div class="prompt-actions"><button class="text-btn" id="inspire">✧ Inspírame</button><span class="tiny" id="char-count">'+prompt.length+'/1200</span></div></div><div class="fields"><div><label class="fieldlabel" for="model">Modelo de IA</label><select id="model">'+MODELS[mode].map((m,i)=>'<option value="'+i+'" '+(model===i?'selected':'')+'>'+m.name+'</option>').join('')+'</select></div><div><label class="fieldlabel" for="ratio">Formato</label><select id="ratio"><option value="9:16">9:16 · Vertical</option><option value="1:1">1:1 · Cuadrado</option><option value="16:9">16:9 · Horizontal</option></select></div></div><p class="model-note" id="model-details">'+modelInfo()+'</p><div class="fieldlabel">Estilo visual</div><div class="styles">'+['Editorial','Cinemático','Producto','Minimalista'].map(s=>'<button data-style="'+s+'" class="style '+(style===s?'selected':'')+'">'+s+'</button>').join('')+'</div><button class="generate" id="generate" '+(busy?'disabled':'')+'><span>✦ '+(busy?'Creando tu muestra…':'Generar '+(mode==='image'?'imagen':'video'))+'</span><small>'+fmt(MODELS[mode][model].cost)+' NT →</small></button><p class="footnote">Solo se descuenta saldo ficticio al completar la simulación.</p></section><section class="panel preview-panel" aria-label="Vista previa">'+previewHtml()+'</section></div><div class="section-head"><div><h2>Un poco de inspiración</h2><p>Explora una idea y hazla tuya.</p></div><button class="text-btn" data-page="projects">Ver mis proyectos ↗</button></div>'+gallery(state.projects.slice(0,4))}
function projects(){let list=state.projects.filter(p=>(filter==='all'||p.type===filter)&&p.name.toLowerCase().includes(query.toLowerCase()));return heading('TU BIBLIOTECA CREATIVA','Ideas que ya tienen forma.','Cada creación es el comienzo de algo más.','<button class="button" data-page="studio">＋ Nueva creación</button>')+'<div class="toolbar"><div class="filters">'+[['all','Todo'],['image','Imágenes'],['video','Videos']].map(([k,t])=>'<button data-filter="'+k+'" class="'+(filter===k?'selected':'')+'">'+t+'</button>').join('')+'</div><input class="search" type="text" id="search" placeholder="Buscar un proyecto…" aria-label="Buscar proyectos" value="'+esc(query)+'"><button class="button secondary" id="editor-btn">▤ Mi historia · '+state.scenes.length+'/5 escenas</button></div>'+gallery(list)}
function basePlans(){return heading('MÁS ESPACIO PARA IMAGINAR','Un plan para cada idea.','Elige cuánto quieres crear. Todas las cifras son propuestas para validar.')+'<div class="plan-grid">'+PLANS.map((p,i)=>'<section class="plan '+(i===1?'featured':'')+'"><div class="eyebrow">'+p.name.toUpperCase()+'</div><div class="price">$'+p.price+'<small> / mes</small></div><strong>'+fmt(p.nt)+' NT mensuales</strong><p class="model-note">Primera compra: +'+fmt(p.nt*.25)+' NT de regalo*</p><ul><li>Imágenes y videos</li><li>Editor de hasta 5 escenas</li><li>Proyectos privados</li><li>Exportación vertical</li></ul><button class="button '+(i===state.plan?'secondary':'')+'" data-plan="'+i+'">'+(i===state.plan?'Plan actual':'Probar este plan →')+'</button></section>').join('')+'</div><div class="notice">*Propuesta de bono único del 25%. Esta demo permite cambiar el plan y reiniciar su saldo base, sin cobros ni renovación real. “Equipo” aún no incluye colaboración multiusuario.</div><section class="panel" style="margin-top:25px"><h2>Crea con tranquilidad</h2><p class="sub">Consulta el consumo antes de generar y revisa cada movimiento en tu historial. Los NT son unidades internas de Neuro, no créditos de Higgsfield.</p></section>'}


let customTokens=3000;
function quoteTokens(raw){const n=Number(raw);if(raw===''||!Number.isSafeInteger(n)||n<100||n>50000)return null;const cents=Math.round(n<=1000?n*1.5:n<=3000?1500+(n-1000)*1.35:n<=5000?4200+(n-3000)*1.15:n*1.3);return {nt:n,price:cents/100,cents}}
function moneyUSD(n){return new Intl.NumberFormat('es-EC',{style:'currency',currency:'USD',minimumFractionDigits:2}).format(n)}
function customRechargeCard(){const q=quoteTokens(customTokens);return '<section class="custom-recharge" aria-label="Recarga personalizada"><div class="custom-intro"><span class="eyebrow">A TU MEDIDA</span><h2>Más espacio para esa gran idea.</h2><p>Elige exactamente cuántos Neuro Tokens necesitas. Una sola recarga, sin cambiar tu plan.</p><details><summary>¿Cómo se calcula el precio?</summary><p>Precios aproximados por volumen: 1.000 NT = USD 15; 3.000 NT = USD 42; 5.000 NT = USD 65. Entre esas cantidades, el precio crece de forma proporcional por tramo. Desde 5.000 NT: USD 0,013 por token. Redondeo a centavos.</p></details></div><div class="custom-control"><label for="custom-nt">¿Cuántos Neuro Tokens quieres recargar?</label><input type="number" id="custom-nt" min="100" max="50000" step="1" inputmode="numeric" value="'+customTokens+'" aria-describedby="custom-error custom-hint"><input type="range" id="custom-range" min="100" max="50000" step="1" value="'+customTokens+'" aria-label="Cantidad de Neuro Tokens"><div class="range-labels"><span>100 NT</span><span>50.000 NT</span></div><p id="custom-hint">Escribe una cantidad o mueve el selector.</p><p id="custom-error" class="custom-error" role="status"></p></div><div class="custom-price"><small>PRECIO APROXIMADO · PAGO ÚNICO</small><strong id="custom-total" aria-live="polite">'+moneyUSD(q.price)+'</strong><p id="custom-balance">Tu saldo quedaría en '+fmt(state.balance+q.nt)+' NT.</p><button class="button" id="buy-custom">Recargar '+fmt(q.nt)+' NT →</button><p>Simulación sin cobros reales.</p></div></section>'}
function refreshCustom(raw,fromRange=false){const q=quoteTokens(raw),valid=!!q;$('#custom-nt').setAttribute('aria-invalid',String(!valid));$('#custom-error').textContent=valid?'':'Introduce un número entero entre 100 y 50.000 NT.';$('#buy-custom').disabled=!valid;if(!valid){$('#custom-total').textContent='—';$('#custom-balance').textContent='Corrige la cantidad para ver tu nuevo saldo.';return}customTokens=q.nt;if(fromRange)$('#custom-nt').value=q.nt;else $('#custom-range').value=q.nt;$('#custom-total').textContent=moneyUSD(q.price);$('#custom-balance').textContent='Tu saldo quedaría en '+fmt(state.balance+q.nt)+' NT.';$('#buy-custom').textContent='Recargar '+fmt(q.nt)+' NT →'}
function confirmRecharge(p,custom=false){if(busy){toast('Espera a que termine la generación.');return}showModal('<h2>Recargar '+fmt(p.nt)+' Neuro Tokens</h2><p class="dialog-text">'+(custom?'Recarga personalizada':'Paquete de recarga')+' · Precio aproximado: '+moneyUSD(p.price)+'.</p><p class="dialog-text">Saldo actual: '+fmt(state.balance)+' NT.<br>Saldo después de la recarga: <b>'+fmt(state.balance+p.nt)+' NT</b>.</p><div class="notice">Operación de demostración. Sin tarjeta ni cobro real. Vigencia comercial propuesta de 90 días; sin bono ni renovación automática.</div><div class="dialog-actions"><button class="button" id="confirm-pack">Confirmar recarga simulada</button></div>');let completed=false;$('#confirm-pack').onclick=()=>{if(completed)return;completed=true;state.balance+=p.nt;state.allocated+=p.nt;state.ledger.push({label:(custom?'Recarga personalizada':'Recarga simulada')+' · '+moneyUSD(p.price)+' aproximados',amount:p.nt,price:p.price,model:'—',date:new Date().toISOString()});save();$('#modal').close();render();toast('Recarga añadida: +'+fmt(p.nt)+' NT ficticios.')}}
function buyCustom(){const q=quoteTokens($('#custom-nt').value);if(!q){refreshCustom($('#custom-nt').value);return}confirmRecharge(q,true)}

function recargas(){return '<div class="section-head"><div><h2>¿Una idea más? Añade Neuro Tokens.</h2><p>Recargas opcionales para suscriptores · precios aproximados en USD.</p></div></div>'+customRechargeCard()+'<div class="recharge-grid">'+PACKS.map((p,i)=>'<section class="panel"><span class="eyebrow">RECARGA '+['ESENCIAL','CREATIVA','INTENSIVA'][i]+'</span><h2 style="margin:12px 0">'+fmt(p.nt)+' NT</h2><div class="pack-price">$'+p.price+' <small>pago único</small></div><p class="model-note">Solo tokens adicionales. Sin cambio de plan.</p><button class="button secondary" style="width:100%;margin-top:16px" data-pack="'+i+'">Simular recarga →</button></section>').join('')+'</div><div class="notice">Propuesta: vigencia de 90 días, sin bono ni renovación automática. Esta demo suma saldo ficticio; no procesa pagos ni vencimientos. La habilitación comercial se plantea después de V1.</div>'}
function plans(){return basePlans()+recargas()}
function buyPack(i){const p=PACKS[i];if(p)confirmRecharge(p,false)}

function tokens(){let spent=-state.ledger.filter(t=>t.amount<0).reduce((a,t)=>a+t.amount,0);return heading('TU ENERGÍA CREATIVA','Cada token, una posibilidad.','Un saldo claro. El control siempre en tus manos.')+'<div class="stats"><div class="stat"><small>Disponible para crear</small><strong>'+fmt(state.balance)+' NT</strong></div><div class="stat"><small>Consumo de esta prueba</small><strong>'+fmt(spent)+' NT</strong></div><div class="stat"><small>Tu plan de prueba</small><strong>'+PLANS[state.plan].name+'</strong></div></div><div class="section-head"><h2>Historial de movimientos</h2><button class="text-btn" id="reset-btn">Reiniciar demostración</button></div><div class="table-wrap"><table><thead><tr><th>MOVIMIENTO</th><th>MODELO</th><th>FECHA</th><th style="text-align:right">NEURO TOKENS</th></tr></thead><tbody>'+state.ledger.slice().reverse().map(t=>'<tr><td>'+esc(t.label)+'</td><td>'+esc(t.model||'—')+'</td><td>'+new Date(t.date).toLocaleDateString('es-EC')+'</td><td class="'+(t.amount>0?'positive':'negative')+'">'+(t.amount>0?'+':'')+fmt(t.amount)+' NT</td></tr>').join('')+'</tbody></table></div><div class="notice">Los movimientos son locales y simulados. No se realizan cargos, compras ni peticiones a proveedores. Los consumos aparecen con signo negativo y las recargas con signo positivo. Los ejemplos iniciales descuentan 230 NT.</div>'}
function render(){updateBalance();$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#breadcrumb').textContent=({studio:'Estudio creativo',projects:'Mis proyectos',plans:'Planes',tokens:'Neuro Tokens'})[page];$('#main').innerHTML='<div class="screen">'+({studio,projects,plans,tokens})[page]()+'</div><footer class="page-footer"><span>neuro studio · De la idea a lo extraordinario.</span><span>Prototipo v1.3 · Datos guardados en este navegador</span></footer>';bindMain()}
function classify(t){t=t.toLowerCase();return /monta|paisaje|viaje|bosque|naturaleza/.test(t)?'landscape':/bolso|moda|arquitect/.test(t)?'fashion':/zapati|deporte|calzado/.test(t)?'shoe':'bottle'}
function generate(){if(busy)return;prompt=$('#prompt').value.trim();if(!prompt){toast('Describe tu idea antes de generar.');$('#prompt').focus();return}const cost=MODELS[mode][model].cost;if(state.balance<cost){toast('No tienes suficientes NT de prueba. Elige otro motor o revisa tu plan.');return}const job={prompt,cost,type:mode,style,model:MODELS[mode][model].name,provider:MODELS[mode][model].provider,ratio:$('#ratio').value,kind:classify(prompt),id:crypto.randomUUID(),name:prompt.slice(0,48)+(prompt.length>48?'…':''),created:Date.now()};busy=true;render();setTimeout(()=>{busy=false;if(state.balance<cost){toast('El saldo cambió. No se realizó ningún consumo.');render();return}state.balance-=cost;state.projects.unshift(job);state.ledger.push({label:'Creación de '+(job.type==='image'?'imagen':'video')+' · muestra',amount:-cost,model:job.model,date:new Date().toISOString()});preview=job;save();render();toast('Muestra lista. Se descontaron '+fmt(cost)+' NT ficticios.')},2400)}
function showModal(html){const d=$('#modal');d.innerHTML='<div class="dialog-top"><h2>Tu espacio creativo</h2><button class="close" aria-label="Cerrar" id="close-modal">×</button></div>'+html;$('#close-modal').onclick=()=>d.close();if(!d.open)d.showModal()}
function openProject(id){const p=state.projects.find(x=>x.id===id);if(!p)return;showModal('<div class="dialog-art '+(p.type==='video'?'video-dialog':'')+'">'+(p.type==='video'?videoPlayer():art(p.kind,p.name))+'</div><h2 style="margin-top:20px">'+esc(p.name)+'</h2><p class="dialog-text">'+esc(p.prompt)+'</p><p class="model-note"><b>Modelo seleccionado:</b> '+esc(p.model||(p.type==='video'?'Runway Gen-4':'Nano Banana Pro'))+' · muestra ilustrativa, sin llamada real a la API.</p><div class="dialog-actions"><button class="button" id="add-scene">＋ Añadir a mi historia</button><button class="button secondary" id="download-sample">'+(p.type==='video'?'Descargar muestra MP4':'Descargar muestra SVG')+'</button><button class="button secondary" id="reuse">Reutilizar idea</button></div>');$('#add-scene').onclick=()=>addScene(id);$('#download-sample').onclick=()=>{if(p.type==='video'){const a=document.createElement('a');a.href=VIDEO_SAMPLE;a.download='neuro-video-muestra.mp4';a.click()}else download(art(p.kind,p.name),'neuro-muestra.svg','image/svg+xml')};$('#reuse').onclick=()=>{prompt=p.prompt;mode=p.type;model=Math.max(0,MODELS[mode].findIndex(m=>m.name===p.model));style=p.style;$('#modal').close();navigate('studio')}}
function addScene(id){if(state.scenes.length>=5){toast('Tu historia admite hasta cinco escenas. Puedes ordenarlas o quitar una.');return}const p=state.projects.find(x=>x.id===id);state.scenes.push({id:crypto.randomUUID(),projectId:id,caption:p.name,duration:5});save();toast('Escena añadida. Abre Mi historia desde Mis proyectos.');if(page==='projects')render()}
function editStory(){showModal('<label class="fieldlabel" for="story-title">Título de la historia</label><input id="story-title" type="text" maxlength="80" value="'+esc(editorTitle)+'"><p class="dialog-text">Hasta cinco escenas · vista vertical 9:16 · orden, duración y subtítulos editables.</p><div class="scenes">'+(state.scenes.length?state.scenes.map((s,i)=>{const p=state.projects.find(p=>p.id===s.projectId);return '<div class="scene"><div class="scene-thumb">'+art(p?.kind||'bottle')+'</div><div class="scene-fields"><small>ESCENA '+(i+1)+'</small><input type="text" aria-label="Subtítulo escena '+(i+1)+'" maxlength="120" data-caption="'+s.id+'" value="'+esc(s.caption)+'"><div class="scene-controls"><button data-up="'+i+'" aria-label="Subir escena" '+(i===0?'disabled':'')+'>↑</button><button data-down="'+i+'" aria-label="Bajar escena" '+(i===state.scenes.length-1?'disabled':'')+'>↓</button><select data-duration="'+s.id+'" aria-label="Duración de escena">'+[2,3,5,8,10].map(d=>'<option '+(s.duration===d?'selected':'')+'>'+d+' s</option>').join('')+'</select><button data-remove="'+i+'" aria-label="Quitar escena">Quitar</button></div></div></div>'}).join(''):'<div class="empty">Añade creaciones a tu historia desde la biblioteca.</div>')+'</div><div class="dialog-actions"><button class="button" id="export-story" '+(!state.scenes.length?'disabled':'')+'>Descargar guion gráfico</button><button class="button secondary" id="preview-story" '+(!state.scenes.length?'disabled':'')+'>▷ Reproducir secuencia</button></div><p class="model-note">Exportación de demo: guion en HTML. La exportación MP4 se conectará en el desarrollo.</p>');
$('#story-title').oninput=e=>{editorTitle=e.target.value;state.storyTitle=editorTitle;save()};
$$('[data-caption]').forEach(el=>el.oninput=()=>{state.scenes.find(s=>s.id===el.dataset.caption).caption=el.value;save()});
$$('[data-duration]').forEach(el=>el.onchange=()=>{state.scenes.find(s=>s.id===el.dataset.duration).duration=parseInt(el.value);save()});
for(const action of ['up','down','remove'])$$('[data-'+action+']').forEach(el=>el.onclick=()=>{let i=Number(el.dataset[action]);if(action==='remove')state.scenes.splice(i,1);else{let j=i+(action==='up'?-1:1);[state.scenes[i],state.scenes[j]]=[state.scenes[j],state.scenes[i]]}save();editStory();render()});
$('#export-story').onclick=exportStory;$('#preview-story').onclick=playStory;
}
let playbackTimer;
function playStory(){let index=0;const tick=()=>{if(!$('#modal').open)return;if(index>=state.scenes.length){editStory();return}let s=state.scenes[index],p=state.projects.find(p=>p.id===s.projectId);showModal('<h2>'+esc(editorTitle)+'</h2><div class="story-frame" style="max-width:250px;aspect-ratio:9/16;margin:20px auto;position:relative;overflow:hidden;border-radius:10px;background:#c1c9b2"><div style="height:100%">'+art(p?.kind||'bottle')+'</div><div style="position:absolute;bottom:22px;left:15px;right:15px;color:white;text-shadow:0 1px 8px #000;background:#1c281e80;border-radius:7px;padding:10px;text-align:center">'+esc(s.caption)+'</div></div><p class="dialog-text">Escena '+(index+1)+' de '+state.scenes.length+' · '+s.duration+' segundos · reproducción simulada</p><button class="button secondary" id="back-editor">Volver al editor</button>');$('#back-editor').onclick=()=>{clearTimeout(playbackTimer);editStory()};index++;playbackTimer=setTimeout(tick,s.duration*1000)};tick()}
$('#modal').addEventListener('close',()=>clearTimeout(playbackTimer));
function exportStory(){const data='<!doctype html><html lang="es"><meta charset="utf-8"><title>'+esc(editorTitle)+'</title><style>body{font:16px system-ui;background:#f5f5ef;padding:32px;color:#28321e}main{max-width:950px;margin:auto}.grid{display:flex;gap:20px;flex-wrap:wrap}article{width:250px;background:white;padding:15px;border-radius:12px}svg{width:100%;height:340px;object-fit:cover}small{color:#777}</style><main><h1>'+esc(editorTitle)+'</h1><p>Neuro Studio · Guion gráfico de demostración · Formato previsto 9:16</p><div class="grid">'+state.scenes.map((s,i)=>'<article><h3>Escena '+(i+1)+'</h3>'+art(state.projects.find(p=>p.id===s.projectId)?.kind||'bottle')+'<p>'+esc(s.caption)+'</p><small>'+s.duration+' segundos</small></article>').join('')+'</div><p>Ilustraciones de muestra. Este archivo no es un video generado.</p></main></html>';download(data,'neuro-guion-grafico.html','text/html');toast('Guion gráfico descargado. La exportación MP4 no está conectada.')}
function download(data,name,type){let url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function choosePlan(i){if(busy){toast('Espera a que termine la generación antes de cambiar el plan.');return}if(i===state.plan){toast('Ya estás probando este plan.');return}const p=PLANS[i];showModal('<h2>Probar el plan '+p.name+'</h2><p class="dialog-text">Tu saldo ficticio se sustituirá por '+fmt(p.nt)+' NT. No se realizará ningún pago ni se activará una suscripción.</p><div class="dialog-actions"><button class="button" id="confirm-plan">Confirmar cambio de prueba</button></div>');$('#confirm-plan').onclick=()=>{state.plan=i;state.balance=p.nt;state.allocated=p.nt;state.ledger=[{label:'Saldo de prueba · Plan '+p.name,amount:p.nt,date:new Date().toISOString()}];save();$('#modal').close();render();toast('Plan de prueba actualizado. Sin cargos reales.')}}
function bindMain(){
if($('#custom-nt')){$('#custom-nt').oninput=e=>refreshCustom(e.target.value);$('#custom-range').oninput=e=>refreshCustom(e.target.value,true);$('#buy-custom').onclick=buyCustom;}
$$('[data-pack]').forEach(b=>b.onclick=()=>buyPack(Number(b.dataset.pack)));
$$('[data-page]',$('#main')).forEach(b=>b.onclick=()=>navigate(b.dataset.page));
$$('[data-open]').forEach(b=>b.onclick=()=>openProject(b.dataset.open));$$('[data-add]').forEach(b=>b.onclick=()=>addScene(b.dataset.add));
$$('[data-mode]').forEach(b=>b.onclick=()=>{if(busy)return;mode=b.dataset.mode;model=0;preview=null;render()});$$('[data-style]').forEach(b=>b.onclick=()=>{style=b.dataset.style;$$('[data-style]').forEach(x=>x.classList.toggle('selected',x===b))});
if($('#prompt'))$('#prompt').oninput=e=>{prompt=e.target.value;$('#char-count').textContent=prompt.length+'/1200'};
if($('#model'))$('#model').onchange=e=>{model=Number(e.target.value);$('#generate small').textContent=fmt(MODELS[mode][model].cost)+' NT →';$('#model-details').innerHTML=modelInfo()};
if($('#generate'))$('#generate').onclick=generate;
if($('#inspire'))$('#inspire').onclick=()=>{const ideas=['Un paisaje de montañas al atardecer, un camino que invita a explorar y una atmósfera cinematográfica.','Un bolso artesanal sobre un pedestal, arquitectura cálida y luz de mañana. Estilo editorial minimalista.','Una zapatilla de diseño sobre fondo azul, luz de estudio y una composición limpia para redes sociales.'];prompt=ideas[Math.floor(Math.random()*ideas.length)];$('#prompt').value=prompt;$('#char-count').textContent=prompt.length+'/1200'};
$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
if($('#search'))$('#search').oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};
if($('#editor-btn'))$('#editor-btn').onclick=editStory;$$('[data-plan]').forEach(b=>b.onclick=()=>choosePlan(Number(b.dataset.plan)));
if($('#reset-btn'))$('#reset-btn').onclick=()=>{if(busy){toast('Espera a que termine la generación.');return}showModal('<h2>¿Volver al punto de partida?</h2><p class="dialog-text">Se eliminarán solo tus proyectos y movimientos de esta demo local.</p><button class="button" id="confirm-reset">Reiniciar demo</button>');$('#confirm-reset').onclick=()=>{state=seed();preview=null;save();$('#modal').close();render();toast('Demo reiniciada: 3.270 NT tras los consumos de ejemplo.')}};
}
$$('aside [data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
$('#help-btn').onclick=()=>showModal('<h2>De una idea a tu primera historia</h2><p class="dialog-text">1. Describe una idea y selecciona imagen o video.<br><br>2. Genera una muestra con saldo ficticio.<br><br>3. Abre el resultado y añádelo a Mi historia.<br><br>4. En Mis proyectos, organiza hasta cinco escenas y edita sus subtítulos.<br><br>5. Descarga un guion gráfico para compartir.</p><div class="notice">Esta demo utiliza imágenes incluidas en el sitio. Incluye un MP4 de muestra. No incluye autenticación, generación de IA, exportación de historias a MP4 ni pagos reales. Todos los datos se guardan únicamente en este navegador.</div>');
let creativeCategory='Todo';
function explore(){return '<section class="creative-hero"><img src="'+ART.landscape+'" alt="Viajero ante un paisaje cinematográfico"><span class="motion-label">NEURO / CREATIVE EXPLORATIONS</span><div class="hero-copy"><span class="eyeline">TU PRÓXIMA IDEA EMPIEZA AQUÍ</span><h1>Imagina algo<br>extraordinario.</h1><p>Encuentra una dirección. Hazla tuya.<br>Crea imágenes e historias con tu propia mirada.</p><div class="hero-actions"><button class="mint-button" data-page="studio">✦ Empieza a crear</button><button class="ghost-button" data-idea="film">Explorar video ↗</button></div></div></section><div class="creative-topline"><div><h2>Un punto de partida. Infinitas ideas.</h2><p>Selecciona una creación para llevar su concepto al estudio.</p></div><span class="eyeline">COLECCIÓN 01</span></div><div class="creative-filters" aria-label="Categorías de inspiración">'+['Todo','Producto','Moda','Cine','Redes'].map(c=>'<button data-category="'+c+'" aria-pressed="'+(c===creativeCategory)+'">'+c+'</button>').join('')+'</div><div class="inspiration-grid">'+ideaCards(IDEAS.filter(i=>creativeCategory==='Todo'||i.category===creativeCategory))+'</div><p class="creative-note">Colección visual creada para esta demo. Las imágenes son referencias; los videos utilizan un MP4 ilustrativo. No son resultados del modelo seleccionado.</p>'}
function useIdea(id){if(busy){toast('Espera a que termine la muestra actual.');return}const i=IDEAS.find(x=>x.id===id);if(!i)return;prompt=i.prompt;mode=i.type;style=i.style;model=0;preview={...i,name:i.title};navigate('studio');$('#prompt')?.focus()}
const previousBindMain=bindMain;
bindMain=function(){previousBindMain();$$('[data-idea]').forEach(b=>b.onclick=()=>useIdea(b.dataset.idea));$$('[data-category]').forEach(b=>b.onclick=()=>{creativeCategory=b.dataset.category;render()})};
const originalStudio=studio;
studio=function(){return '<div class="studio-tip"><span>✦ Tu idea, tu dirección. Personaliza el concepto y elige tu modelo.</span><button data-page="explore">← Explorar ideas</button></div>'+originalStudio()};
render=function(){updateBalance();$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#breadcrumb').textContent=({explore:'Explorar ideas',studio:'Crear',projects:'Mis proyectos',plans:'Planes',tokens:'Neuro Tokens'})[page];$('#main').innerHTML='<div class="screen">'+({explore,studio,projects,plans,tokens})[page]()+'</div><footer class="page-footer"><span>neuro studio · Tu imaginación, en movimiento.</span><span>Demo v1.4 · Sin pagos ni generación real</span></footer>';bindMain()};
const originalDownload=download;
download=async function(data,name,type){try{for(const path of [...new Set(Object.values(ART))]){if(!data.includes(path))continue;const response=await fetch(path);if(!response.ok)throw new Error('asset');const blob=await response.blob();const encoded=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)});data=data.split(path).join(encoded)}originalDownload(data,name,type)}catch{toast('No se pudo preparar la descarga. Abre la demo publicada e inténtalo nuevamente.')}};
page='explore';
render();
const presetId=new URLSearchParams(window.location.search).get('idea');
if(presetId)useIdea(presetId);

</script></body></html>
